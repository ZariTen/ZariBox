# archbox.yaml - ZariBox config for an Arch Linux dev container
# Run: zaribox apply archbox.yaml

Name: archbox
Backend: podman
Image: archlinux

# Optional: custom home directory (persists across recreations)
HomeDir: /home/$USER/Documents/Archbox/

# Optional: mount host home directory
HomeMount: true

Packages:
  - base-devel
  - git
  - neovim
  - starship
  - fish
  - python
  - python-pyaml

# Optional: commands to run after package install
Run:
  - echo 'exec fish' >> ~/.bashrc
  - mkdir -p ~/.config/fish && echo 'eval "$(starship init fish)"' >> ~/.config/fish/config.fish

# Optional: extra flags passed to `podman create`
ExtraFlags: --device nvidia.com/gpu=all
