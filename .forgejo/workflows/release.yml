name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Forgejo release
    runs-on: codeberg-small
    timeout-minutes: 10

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          previous_tag=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${version} already exists; skipping release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Preparing v${version} (previous tag: ${previous_tag:-none})."
          fi

      - name: Generate release notes
        if: steps.release.outputs.publish == 'true'
        env:
          CURRENT_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail

          range=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range=("${PREVIOUS_TAG}..HEAD")
          fi

          get_commits() {
            git log "${range[@]}" --pretty=format:"- %h: %s" -E --grep="$1" || true
          }

          append_section() {
            local title="$1"
            local content="$2"
            if [[ -n "$content" ]]; then
              printf "### %s\n%s\n\n" "$title" "$content" >> /tmp/release-notes.md
            fi
          }

          : > /tmp/release-notes.md
          append_section "Features"      "$(get_commits '^feat(\([^)]*\))?!?:')"
          append_section "Bug Fixes"     "$(get_commits '^fix(\([^)]*\))?!?:')"
          append_section "Refactoring"   "$(get_commits '^refactor(\([^)]*\))?!?:')"
          append_section "Documentation" "$(get_commits '^docs(\([^)]*\))?!?:')"
          append_section "Performance"   "$(get_commits '^perf(\([^)]*\))?!?:')"
          append_section "Chores"        "$(get_commits '^chore(\([^)]*\))?!?:')"
          append_section "Other"         "$(get_commits '^(style|test|ci|build|revert)(\([^)]*\))?!?:')"

          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "- Version bump to ${CURRENT_VERSION}" > /tmp/release-notes.md
          fi

      - name: Create Forgejo release
        if: steps.release.outputs.publish == 'true'
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg tag_name "$TAG" \
            --arg name "$TAG" \
            --rawfile body /tmp/release-notes.md \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false}' \
            > /tmp/release.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${API_URL}/repos/${REPOSITORY}/releases" \
            --header "Authorization: token ${API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/release.json
