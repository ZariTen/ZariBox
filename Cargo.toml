[package]
name = "zaribox"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Declarative Podman manager"
license = "GPL-3.0-only"
repository = "https://github.com/ZariTen/zaribox"
readme = "README.md"
default-run = "zaribox"

[[bin]]
name = "zaribox"
path = "src/main.rs"

[[bin]]
name = "zaribox-mcp"
path = "src/bin/zaribox-mcp.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
humantime = "2"
nix = { version = "0.30", features = ["user", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3"
shlex = "1.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
