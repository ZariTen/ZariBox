[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zaribox"
dynamic = ["version"]
description = "Declarative Podman manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
zaribox = "zaribox.cli:main"
zaribox-mcp = "zaribox.mcp_server:main"

[tool.setuptools.packages.find]
include = ["zaribox*"]

[tool.setuptools.dynamic]
version = {attr = "zaribox.__version__"}

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
]
dev = [
    "mcp>=2.0,<3",
    "pytest>=8.0",
    "ruff",
]
