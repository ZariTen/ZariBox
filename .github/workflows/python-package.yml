name: CI

on:
  push:
    branches: [main]
    paths:
      - "zaribox/**/*.py"
      - "tests/**/*.py"
      - pyproject.toml
      - .github/workflows/python-package.yml
  pull_request:
    branches: [main]
    paths:
      - "zaribox/**/*.py"
      - "tests/**/*.py"
      - pyproject.toml
      - .github/workflows/python-package.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check --select E9,F63,F7,F82 .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Test every supported Python on PRs; use one representative version on main.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.12"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input ".[dev]"

      - name: Run tests
        run: python -m pytest
